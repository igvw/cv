    Arbeidserfaring:
      - name: Spatialedge
        date: 09/2022 - 03/2026
        location: Stellenbosch, Sør-Afrika
        summary: Oppdrag innan plattformdrift, geografisk modellering
          og analyse av straumsal.
      - name: Data Scientist - Prepaid Electricity Analytics
        date: 10/2025 - 03/2026
        highlights:
          - Utvikla rapporteringsdatasett og analyseprosessar for transaksjonar og sal av
            førehandsbetalt straum i Google Cloud.
          - Utvikla dashbord i Looker Studio og tidsstyrte køyring av notatbøker med tenestekontoar
            i Vertex AI for dagleg rapportering.
          - Effektiviserte historiske SQL-innlastingar ved å erstatte handsaming dag for dag med eit
            meir effektivt spørjingsmønster; konfigurerte tidsstyrte arbeidsflytar og varsel.
      - name: Geo-informatics Data Scientist
        date: 08/2025 - 09/2025
        highlights:
          - Analyserte geografiske og tidsmessige trafikkmønster med Python og GeoPandas og
            utarbeidde visualiseringar av vegnettet, områdespesifikke frekvensdiagram og prognosar.
          - Utvikla satsvis handsaming av store geografiske datamengder på ein virtuell maskin med
            avgrensa minne.
          - Samanlikna resultata med ein alternativ analysemetode basert på eit separat datasett.
      - name: DevOps Engineer
        date: 09/2022 - 07/2025
        summary: Arbeidde med produksjonsdrift på ei lokal Cloudera/Hadoop-klynge i petabyteskala
          for ein telekomleverandør.
        highlights:
          - Sette opp og heldt ved like 16 Apache Airflow-instansar på OpenShift (Kubernetes) med
            Helm, på tvers av team, miljø og oppsett for høg tilgjengelegheit.
          - Utvikla programvare for å overvake og koordinere planlagd dataarkivering til AWS S3 og
            sletting frå Hadoop-miljø.
          - Automatiserte daglege driftskontrollar og reduserte gjentakande manuelt arbeid for
            ingeniørane.
          - Undersøkte Apache Spark-feil og problem med kolonnetypar som påverka datahandsaminga.
          - Deltok i vaktordningar på kveldar og i helger med vedlikehald, oppdateringar og
            feilsøking i produksjon.
