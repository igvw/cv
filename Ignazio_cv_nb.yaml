      - label: Analyse og maskinlæring
        details: Pandas, GeoPandas, scikit-learn, Plotly, datavisualisering, prognoser, geografisk
          analyse
    Arbeidserfaring:
      - name: Spatialedge
        date: 09/2022 - 03/2026
        location: Stellenbosch, Sør-Afrika
        summary: Oppdrag innen plattformdrift, geografisk modellering
          og analyse av strømsalg.
      - name: Data Scientist - Prepaid Electricity Analytics
        date: 10/2025 - 03/2026
        highlights:
          - Utviklet rapporteringsdatasett og analyseprosesser for transaksjoner og salg av
            forhåndsbetalt strøm i Google Cloud.
          - Utviklet dashbord i Looker Studio og tidsstyrte kjøring av notatbøker med
            tjenestekontoer i Vertex AI for daglig rapportering.
          - Effektiviserte historiske SQL-innlastinger ved å erstatte behandling dag for dag med et
            mer effektivt spørringsmønster; konfigurerte tidsstyrte arbeidsflyter og varsler.
      - name: Geo-informatics Data Scientist
        date: 08/2025 - 09/2025
        highlights:
          - Analyserte geografiske og tidsmessige trafikkmønstre med Python og GeoPandas og
            utarbeidet visualiseringer av veinettet, områdespesifikke frekvensdiagrammer og
            prognoser.
          - Utviklet satsvis behandling av store geografiske datamengder på en virtuell maskin med
            begrenset minne.
          - Sammenlignet resultatene med en alternativ analysemetode basert på et separat datasett.
      - name: DevOps Engineer
        date: 09/2022 - 07/2025
        summary: Arbeidet med produksjonsdrift på en lokal Cloudera/Hadoop-klynge i petabyteskala
          for en telekomleverandør.
        highlights:
          - Satte opp og vedlikeholdt 16 Apache Airflow-instanser på OpenShift (Kubernetes) med
            Helm, på tvers av team, miljøer og oppsett for høy tilgjengelighet.
          - Utviklet programvare for å overvåke og koordinere planlagt dataarkivering til AWS S3 og
            sletting fra Hadoop-miljøer.
          - Automatiserte daglige driftskontroller og reduserte gjentakende manuelt arbeid for
            ingeniørene.
          - Undersøkte Apache Spark-feil og problemer med kolonnetyper som påvirket
            databehandlingen.
          - Deltok i vaktordninger på kvelder og i helger med vedlikehold, oppdateringer og
            feilsøking i produksjon.
    Utdanning:
