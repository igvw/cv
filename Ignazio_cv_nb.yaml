      - name: Studentassistent | Stellenbosch University
        date: 02/2015 - 06/2015
        summary: Veiledet førsteårsstudenter og bistod med øvinger, prosjekter og vurderinger.
      - name: Praktikant i programvareutvikling | Vastech
        date: 12/2014 - 01/2015
        summary: Utviklet et verktøy i Go for å kontrollere bakoverkompatibilitet i Googles Protocol
          Buffers.
